<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Debug Console</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔎</text></svg>">
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3;
    --dim:#8b949e; --accent:#58a6ff; --green:#3fb950; --amber:#d29922; --red:#f85149;
  }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text);
         font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; padding:24px; }
  h1 { font-size:18px; margin-bottom:4px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:20px; }
  .row { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  input[type=text] { flex:1; min-width:280px; background:var(--panel);
    border:1px solid var(--border); border-radius:6px; color:var(--text);
    padding:10px 12px; font:inherit; }
  select, button { background:var(--panel); border:1px solid var(--border);
    border-radius:6px; color:var(--text); padding:10px 12px; font:inherit; cursor:pointer; }
  button.primary { background:#1f6feb; border-color:#1f6feb; font-weight:600; }
  label.toggle { display:flex; align-items:center; gap:6px; color:var(--dim);
    font-size:12px; padding:10px 4px; cursor:pointer; }
  .panel { background:var(--panel); border:1px solid var(--border);
    border-radius:8px; padding:16px; margin-bottom:16px; }
  .panel h2 { font-size:13px; color:var(--dim); text-transform:uppercase;
    letter-spacing:.08em; margin-bottom:10px; }
  .degraded { color:var(--amber); }
  .answer { white-space:pre-wrap; }
  .answer .null { color:var(--dim); font-style:italic; }
  .cite { border-left:3px solid var(--accent); padding:8px 12px; margin:8px 0;
    background:rgba(88,166,255,.05); border-radius:0 6px 6px 0; }
  .cite .meta { color:var(--dim); font-size:12px; margin-bottom:4px; }
  .cite .text { font-size:13px; color:#c9d1d9; }
  .bar-row { display:grid; grid-template-columns:90px 1fr 70px; gap:8px;
    align-items:center; margin:3px 0; font-size:12px; }
  .bar { height:14px; border-radius:3px; background:var(--accent); min-width:2px; }
  .stage-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px; }
  .stage { background:var(--bg); border:1px solid var(--border); border-radius:6px;
    padding:10px; font-size:12px; overflow-x:auto; }
  .stage h3 { font-size:11px; color:var(--accent); text-transform:uppercase;
    letter-spacing:.06em; margin-bottom:6px; }
  .stage table { border-collapse:collapse; width:100%; }
  .stage td { padding:2px 8px 2px 0; color:var(--dim); white-space:nowrap; }
  .stage td:first-child { color:var(--text); }
  .hidden { display:none; }
  .err { color:var(--red); }
  .spin { color:var(--dim); }
</style>
</head>
<body>
  <h1>Advanced-RAG-System <span style="color:var(--dim)">/ debug console</span></h1>
  <div class="sub">every pipeline stage, visible — original query → rewrite → dense → sparse → fusion → MMR → rerank → context → answer</div>

  <div class="row">
    <input id="q" type="text" placeholder="What are Apple's supply chain risks?"
           value="What are Apple's main supply chain risks?">
    <button class="primary" onclick="run()">Query</button>
  </div>
  <div class="row">
    <select id="topk"><option>3</option><option selected>5</option><option>10</option></select>
    <input id="ticker" type="text" placeholder="filter: ticker (e.g. AAPL)" style="max-width:180px">
    <input id="item" type="text" placeholder="filter: item (e.g. 1A)" style="max-width:160px">
    <label class="toggle"><input id="gen" type="checkbox" checked> generate</label>
    <label class="toggle"><input id="dbg" type="checkbox" checked> debug</label>
  </div>

  <div id="status" class="sub"></div>

  <div id="answerPanel" class="panel hidden">
    <h2>Answer <span id="degraded" class="degraded"></span></h2>
    <div id="answer" class="answer"></div>
  </div>

  <div id="citePanel" class="panel hidden">
    <h2>Citations</h2>
    <div id="cites"></div>
  </div>

  <div id="timingPanel" class="panel hidden">
    <h2>Stage timings</h2>
    <div id="timings"></div>
  </div>

  <div id="debugPanel" class="panel hidden">
    <h2>Pipeline stages</h2>
    <div id="stages" class="stage-grid"></div>
  </div>

<script>
const $ = id => document.getElementById(id);

async function run() {
  $('status').textContent = 'running...'; $('status').className = 'sub spin';
  for (const id of ['answerPanel','citePanel','timingPanel','debugPanel'])
    $(id).classList.add('hidden');

  const filters = {};
  if ($('ticker').value.trim()) filters.ticker = $('ticker').value.trim().toUpperCase();
  if ($('item').value.trim())   filters.item = $('item').value.trim();

  let resp, body;
  try {
    resp = await fetch('/api/v1/query', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        query: $('q').value, top_k: +$('topk').value,
        filters: Object.keys(filters).length ? filters : null,
        generate: $('gen').checked, include_debug: $('dbg').checked })
    });
    body = await resp.json();
  } catch (e) { $('status').textContent = 'request failed: ' + e; $('status').className='sub err'; return; }

  if (!resp.ok) {
    $('status').textContent = `HTTP ${resp.status}: ${JSON.stringify(body.error || body)}`;
    $('status').className = 'sub err'; return;
  }
  $('status').textContent = '';

  // answer
  $('answerPanel').classList.remove('hidden');
  $('degraded').textContent = body.degraded ? ' — degraded: ' + body.degraded.join(', ') : '';
  $('answer').innerHTML = body.answer
      ? escapeHtml(body.answer)
      : '<span class="null">answer: null — retrieval succeeded, generation ' +
        (body.degraded?.includes('generation_unavailable') ? 'unavailable (degradation contract working as designed)' : 'skipped (generate:false)') +
        '. Citations below are the product.</span>';

  // citations
  $('citePanel').classList.remove('hidden');
  $('cites').innerHTML = (body.citations||[]).map(c => `
    <div class="cite">
      <div class="meta">[${c.id}] ${escapeHtml(c.document_name||c.document_id)}
        ${c.section ? ' · Item ' + c.section : ''} · score ${c.score} · chunk ${c.chunk_id.slice(0,8)}…</div>
      <div class="text">${escapeHtml(c.text.slice(0,400))}${c.text.length>400?'…':''}</div>
    </div>`).join('') || '<span class="sub">none</span>';

  // timings
  const t = body.timings_ms || {};
  const entries = Object.entries(t).filter(([k]) => k !== 'total');
  const max = Math.max(...entries.map(([,v]) => v), 1);
  $('timingPanel').classList.remove('hidden');
  $('timings').innerHTML = entries.map(([k,v]) =>
    `<div class="bar-row"><span>${k}</span>
       <div><div class="bar" style="width:${Math.max(2,(v/max)*100)}%"></div></div>
       <span>${v} ms</span></div>`).join('') +
    `<div class="bar-row"><span><b>total</b></span><div></div><span><b>${t.total??''} ms</b></span></div>`;

  // debug stages
  if (body.debug) {
    $('debugPanel').classList.remove('hidden');
    const d = body.debug;
    const table = rows => '<table>' + rows.map(r =>
      '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('') + '</table>';
    $('stages').innerHTML = [
      ['query rewrite', table([['original', escapeHtml(d.original_query)],
                               ['rewritten', escapeHtml(d.rewritten_query)]])],
      ['dense top-10', table((d.dense_results||[]).map(r => [r.chunk_id.slice(0,8)+'…', r.score]))],
      ['sparse (BM25) top-10', table((d.sparse_results||[]).map(r => [r.chunk_id.slice(0,8)+'…', r.score]))],
      ['RRF fusion', table((d.fusion_results||[]).map(r =>
          [r.chunk_id.slice(0,8)+'…', r.fused_score, JSON.stringify(r.source_ranks)]))],
      ['MMR selected', table((d.mmr_selected||[]).map((id,i) => [i+1, id.slice(0,8)+'…']))],
      ['rerank scores', table((d.rerank_results||[]).map(r =>
          [r.chunk_id.slice(0,8)+'…', r.rerank_score]))],
      ['context', table([['chunks', (d.context_chunk_ids||[]).length],
                         ['dropped', JSON.stringify(d.context_dropped)]])],
    ].map(([name, html]) => `<div class="stage"><h3>${name}</h3>${html}</div>`).join('');
  }
}

function escapeHtml(s) { const div = document.createElement('div');
  div.textContent = s ?? ''; return div.innerHTML; }

$('q').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
</script>
</body>
</html>
