# Alert rules on the metrics that catch SILENT failure - no exception, no error
# rate, just quietly stale retrieval. These are the two gauges from the PRD.
groups:
  - name: rag-silent-failures
    rules:
      - alert: OutboxSyncStalled
        expr: rag_outbox_pending_total > 500
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Qdrant sync is falling behind - retrieval is going stale"
          description: "{{ $value }} chunks are written to Postgres but not yet in Qdrant. The outbox worker is likely dead or Qdrant is unreachable."
      - alert: IngestionQueueGrowing
        expr: rag_ingestion_jobs_pending > 100
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Ingestion jobs are piling up - workers may be dead"
          description: "{{ $value }} jobs pending for 10m. Scale workers or check for a poison document."
      - alert: RagApiDown
        expr: up{job="rag-api"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "RAG API is not being scraped - the service may be down"
