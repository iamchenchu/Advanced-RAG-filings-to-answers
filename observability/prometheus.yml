# Prometheus scrape + alerting config.
# host.docker.internal = the Mac (where the RAG API runs on :8000).
global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: rag-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  # Workers expose their own registry when METRICS_PORT is set
  # (workers/*.py _maybe_serve_metrics). Enable once run with a stable port.
  # - job_name: rag-workers
  #   static_configs:
  #     - targets: ["host.docker.internal:9100"]
