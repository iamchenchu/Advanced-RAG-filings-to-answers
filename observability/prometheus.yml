# Prometheus scrape config.
# host.docker.internal = "the Mac itself" as seen from inside a container -
# the RAG API runs on the host, the observability stack runs in Docker.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: rag-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
